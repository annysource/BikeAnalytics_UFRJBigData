services:

  # ─── HADOOP ────────────────────────────────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=citibike-cluster
    env_file:
      - ./hadoop.env
    mem_limit: 512m

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    mem_limit: 512m

  # ─── SPARK ─────────────────────────────────────────────────────────────────
  # Imagem oficial do Apache
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    mem_limit: 512m

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=512m
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    mem_limit: 512m

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=512m
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    mem_limit: 512m

  # ─── WEB UI ────────────────────────────────────────────────────────────────
  web-ui:
    image: python:3.11-slim
    container_name: citibike-web
    working_dir: /app
    command: >
      bash -c "pip install streamlit hdfs requests plotly pandas && streamlit run app.py --server.port=5000 --server.address=0.0.0.0"
    volumes:
      - ./apps/web:/app
    ports:
      - "5000:5000"
    depends_on:
      - namenode
      - spark-master
    restart: on-failure
    mem_limit: 256m


  # ─── JUPYTER ────────────────────────────────────────────────────────────────
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: citibike-jupyter
    command: >
      bash -c "pip install pyspark==3.5.1 hdfs requests jupyterlab --quiet && start-notebook.sh"
    ports:
      - "8888:8888"
    volumes:
      - ./apps:/home/jovyan/work
      - ./notebooks:/home/jovyan/notebooks
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
      - HADOOP_CONF_DIR=/etc/hadoop
      - JUPYTER_TOKEN=citibike
    depends_on:
      - namenode
      - spark-master
    mem_limit: 768m

  # ─── INGESTÃO ───────────────────────────────────────────────────────────────
  ingest:
    image: python:3.11-slim
    container_name: citibike-ingest
    working_dir: /app
    command: >
      bash -c "pip install requests hdfs --quiet && python3 fetch_citibike.py"
    volumes:
      - ./apps/ingest:/app
      - ingest_tmp:/tmp         # volume dedicado para os ZIPs temporários
    depends_on:
      - namenode
    restart: on-failure
    mem_limit: 768m             # ← era 128m, agora 768m para aguentar extração


volumes:
  hadoop_namenode:
  hadoop_datanode:
  ingest_tmp:

